[package]
name = "coffee_log"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
coffee_log_core = { path = "../coffee_log_core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
worker = { version = "0.8.6", features = ["d1"] }

[dev-dependencies]
reqwest = { version = "0.12", features = ["blocking"] }
