[package]
name = "brew_book_admin"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
brew_book_core = { path = "../brew_book_core" }
# 依存は利用者向けの Worker (brew_book) と同じ組に限る (ADR-0001)。
serde = { version = "1", features = ["derive"] }
worker = { version = "0.8.6", features = ["d1"] }

[dev-dependencies]
# `wrangler dev` を起動する結合テストのハーネス (0001 のハーネスと同じ方式) に使う。
# 利用者向けの Worker の結合テストと同じ組に限る (ADR-0001)。
# libc はハーネスが `wrangler` をプロセスグループごと停止するために使う (0019)。
libc = "0.2"
# 接続先は `http://127.0.0.1` だけなので TLS を使わない。既定の feature (`native-tls` と
# `system-proxy`) を外して依存のビルドを減らす (0053)。
reqwest = { version = "0.12", default-features = false, features = ["blocking"] }
serde_json = "1"
