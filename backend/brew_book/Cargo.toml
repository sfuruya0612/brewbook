[package]
name = "brew_book"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
brew_book_core = { path = "../brew_book_core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
worker = { version = "0.8.6", features = ["d1"] }

[dev-dependencies]
# 結合テストのハーネスが `wrangler` をプロセスグループごと停止するために追加する (0019)。
libc = "0.2"
# 結合テストのハーネスの HTTP クライアント。接続先は `http://127.0.0.1` と `http://localhost`
# だけなので TLS を使わない。既定の feature (`native-tls` と `system-proxy`) を外して
# 依存のビルドを減らす (0053)。
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json"] }
# ブラウザを操作する WebDriver のクライアント。fantoccini と比較し、CDP を送れること
# (テーマの切り替えの `Emulation.setEmulatedMedia` に使う) と、要素と画面のスクリーンショット
# の API を持つことから thirtyfour を選んだ。WebAuthn の仮想認証器は ChromeDriver の拡張
# コマンドで付ける (0053 で headless_chrome から移行。パスキーの結合テストと E2E が共有する)。
# manager (chromedriver の自動起動と取得) は使わないため既定の feature から外す。
thirtyfour = { version = "0.37", default-features = false, features = [
  "reqwest",
  "rustls",
  "cdp",
] }
# thirtyfour の非同期の API を同期のテストから実行するためのランタイム (0044)。
tokio = { version = "1", features = ["rt-multi-thread", "time"] }
