[package]
name = "brew_book"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
brew_book_core = { path = "../brew_book_core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
worker = { version = "0.8.6", features = ["d1"] }

[dev-dependencies]
# CDP の仮想認証器でパスキーの結合テストを行うために追加する (0005 のテスト、ADR-0004)。
headless_chrome = "1.0"
# 結合テストのハーネスが `wrangler` をプロセスグループごと停止するために追加する (0019)。
libc = "0.2"
reqwest = { version = "0.12", features = ["blocking"] }
