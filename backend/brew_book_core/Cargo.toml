[package]
name = "brew_book_core"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
# ADR-0004 が定める ES256 の検証の依存。既定の feature の `std` は getrandom を引き込み、
# getrandom は wasm32-unknown-unknown のビルドに追加の設定を要求するため、無効にする。
# 検証と (テストの) 署名に要る feature は `ecdsa` だけである。
p256 = { version = "0.14.0", default-features = false, features = ["ecdsa"] }
serde = { version = "1", features = ["derive"] }
# `float_roundtrip` は JSON の小数の復号を正しく丸める。カーソルは小数のキーの値を JSON の
# 数値で運ぶため、これが無いと符号化と復号の往復で 1 ULP ずれることがあり、ページングの
# 続きが重複または漏れうる (0051、FR-20)。
serde_json = { version = "1", features = ["float_roundtrip"] }
sha2 = "0.11.0"
# ADR-0003 が定める署名付き PUT URL の生成の依存。Sans I/O の S3 クライアントで、
# HTTP 通信は持たない。版はプレリリースのため固定する (ADR-0003)。
# 既定の feature の `rust-crypto` を使い、`aws_lc_rs` は有効にしない。
shiguredo_s3 = "=2026.1.0-canary.7"
