[package]
name = "brew_book_pbt"
version = "0.1.0"
edition = "2021"
publish = false

[dev-dependencies]
brew_book_admin = { path = "../brew_book_admin" }
brew_book_core = { path = "../brew_book_core" }
# `fork` と `timeout` は使わない (`ProptestConfig` を使わず、`timeout` の既定は 0) ため、
# 既定の feature を外す (0053)。
proptest = { version = "1", default-features = false, features = ["std"] }
# 応答の JSON の値を作るため (brew_book_core の依存に含まれるクレート。issue 0034 の乖離)。
serde_json = "1"
