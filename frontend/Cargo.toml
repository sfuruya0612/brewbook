# Frontend のクレートとワークスペース (ADR-0017)。
# 移行の間は Flutter のファイル (lib/、test/、web/ など) と同じディレクトリに置き、
# Flutter の削除は 0045 で行う。

[package]
name = "brew_book_frontend"
version = "0.1.0"
edition = "2021"
publish = false

[features]
# 0044 の E2E (実 Worker と仮想認証器) が、テストコード入りの Web ビルドを作るときに有効にする。
# 0037 では feature の枠だけを置き、中身は 0044 で足す。
e2e = []

[dependencies]
# Web だけを対象にする (ADR-0017)。版は Cargo.lock で固定する。
dioxus = { version = "0.7.10", features = ["web"] }

[dev-dependencies]
# ブラウザで動かすテスト (dioxus:test-web) に使う (ADR-0017)。
wasm-bindgen-test = "0.3"
# manifest.json を JSON として検査する (0037 のレビューの指摘。文字列の一致では整形の変更や
# 壊れた JSON を検出できないため、値を比較する)。
serde_json = "1"

[workspace]
resolver = "2"
