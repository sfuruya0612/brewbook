<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="brewbook の Frontend (ADR-0017)">

  <!-- 表示名と favicon と manifest は Flutter の frontend/web/index.html から引き継ぐ (ADR-0017)。 -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="brewbook">

  <!-- favicon、icons、manifest は public/ の静的アセットとして配信する。 -->
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="manifest" href="manifest.json">

  <!-- 書体 (IBM Plex Sans JP、IBM Plex Mono、IBM Plex Serif) とアイコン (Material Icons
       Outlined) は Google Fonts から読む (docs/design/README.md、ADR-0014 を Web 向けに改訂、0039)。
       フォントファイルはリポジトリに含めない。 -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+JP:wght@400;500;600&family=IBM+Plex+Serif:wght@500&display=swap">
  <link rel="stylesheet" href="https://fonts.googleapis.com/icon?family=Material+Icons+Outlined">

  <!-- Tailwind CLI の出力 (dx が tailwind.css から生成して public/ に置く)。 -->
  <link rel="stylesheet" href="tailwind.css">

  <!-- 2 テーマを data-theme (paper と night) で切り替える。既定は Paper とし、OS がダークの
       ときは Night を表示する (2026-10-02 の所有者の決定。Flutter の themeMode 未指定と同じ)。
       Dioxus の起動前に付けて、最初の描画からテーマを合わせる。 -->
  <script>
    (function () {
      var query = window.matchMedia("(prefers-color-scheme: dark)");
      function apply() {
        document.documentElement.setAttribute("data-theme", query.matches ? "night" : "paper");
      }
      apply();
      query.addEventListener("change", apply);
    })();
  </script>

  <title>{app_title}</title>
</head>
<body>
  <div id="main"></div>
</body>
</html>
