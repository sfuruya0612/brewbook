name: CI

on:
  push:
    branches:
      - main
  pull_request:

# 検査に必要なのはリポジトリの読み取りだけとする。
permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    # 外部プロセス (wrangler dev) を起動するテストがハングした場合に runner を占有し続けないようにする。
    # check は 0017 の e2e (flutter drive) を含めて手元で 27 分前後かかるため、ハングしたテストが
    # 後続の検査を巻き込まない余裕として 60 分にする。
    # 2026-09-27 は lint の失敗後に mise が終了せず、この timeout で止まった (issue 0032)。
    # ハングの最終的な歯止めとして残す。
    timeout-minutes: 60
    steps:
      # action の版はコミットハッシュで固定する (ADR-0011)。タグは可変のため使わない。
      # actions/checkout v7.0.1 (2026-09-26 に GitHub API でタグの指すコミットを確認)
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      # mise を入れ、mise.toml の [tools] のツールをインストールする。
      # jdx/mise-action v4.3.0 (2026-09-26 に GitHub API でタグの指すコミットを確認)
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c
      # ブラウザ本体はリポジトリのツールチェーン (mise.toml) に含められないため、CI の環境の
      # 依存としてワークフローで版を固定して入れる (issue 0013)。版は mise.toml の chromedriver と揃える。
      - name: Install Chrome for Testing
        run: |
          curl -fsSL -o chrome-for-testing.zip \
            "https://storage.googleapis.com/chrome-for-testing-public/154.0.8037.57/linux64/chrome-linux64.zip"
          unzip -q chrome-for-testing.zip
          # chromedriver が探す名前 (google-chrome) で PATH の先頭に置き、Flutter には
          # CHROME_EXECUTABLE で同じ実体を指す。Runner 上の ChromeDriver は
          # /opt/google/chrome/chrome も直接使うため、そのパスも同じ実体にする。
          sudo ln -sf "$PWD/chrome-linux64/chrome" /usr/local/bin/google-chrome
          sudo ln -sf "$PWD/chrome-linux64/chrome" /opt/google/chrome/chrome
          echo "CHROME_EXECUTABLE=$PWD/chrome-linux64/chrome" >> "$GITHUB_ENV"
      # 手元と同じ入口のタスクで、静的検査と全ての自動テストを実行する (ADR-0009)。
      - run: mise run check
