[tools]
flutter = { version = "3.47.5", checksum_expr = '"sha256:" + filter(fromJSON(body).releases, { #.archive endsWith filename })[0].sha256', platforms = { linux-x64 = { checksum_url = "https://storage.googleapis.com/flutter_infra_release/releases/releases_linux.json", url = "https://storage.googleapis.com/flutter_infra_release/releases/stable/linux/flutter_linux_{{ version }}-stable.tar.xz" }, macos-arm64 = { checksum_url = "https://storage.googleapis.com/flutter_infra_release/releases/releases_macos.json", url = "https://storage.googleapis.com/flutter_infra_release/releases/stable/macos/flutter_macos_arm64_{{ version }}-stable.zip" }, macos-x64 = { checksum_url = "https://storage.googleapis.com/flutter_infra_release/releases/releases_macos.json", url = "https://storage.googleapis.com/flutter_infra_release/releases/stable/macos/flutter_macos_{{ version }}-stable.zip" }, windows-x64 = { checksum_url = "https://storage.googleapis.com/flutter_infra_release/releases/releases_windows.json", url = "https://storage.googleapis.com/flutter_infra_release/releases/stable/windows/flutter_windows_{{ version }}-stable.zip" } }, version_expr = 'fromJSON(body).releases | filter({ #.channel == "stable" }) | map({ replace(#.version, "-stable", "") }) | sortVersions()', version_list_url = "https://storage.googleapis.com/flutter_infra_release/releases/releases_linux.json" }
rust = { version = "1.98.1", targets = ["wasm32-unknown-unknown"] }
"cargo:worker-build" = "0.8.6"
wrangler = { version = "4.135.0", allow_builds = ["esbuild", "sharp", "workerd"] }
ripgrep = "15.2.0"
# Flutter の統合テスト (flutter drive) が使う。版は手元の Chrome と CI の Chrome for Testing に
# 揃える (ブラウザ本体はリポジトリのツールチェーンに含められないため、CI はワークフローで同じ版を入れる)。
chromedriver = "154.0.8037.57"
# ローカルの負荷試験のクライアント (issue 0025、ADR-0012)。
k6 = "2.3.0"
# TLA+ の TLC を動かす JDK (ADR-0013)。
java = "temurin-25.0.4+101.0.LTS"

# ツールの版とコマンドラインは mise.toml に集約する (ADR-0009)。
# タスクは標準のコマンドの組み合わせにし、ツールの版は [tools] だけが持つ。

[tasks.setup]
description = "開発に必要な依存を取得する"
dir = "backend"
run = "cargo fetch"

[tasks.fmt]
description = "Rust の整形を検査する"
dir = "backend"
run = "cargo fmt --all --check"

[tasks.lint]
description = "Rust の lint と、絵文字を使わない規約の検査を実行する"
run = [
  "cargo clippy --manifest-path backend/Cargo.toml --workspace --all-targets -- -D warnings",
  # fuzz のターゲットはワークスペース外のため、型検査をここで行う (実行は CI では行わない)。
  "cargo check --manifest-path backend/brew_book_core/fuzz/Cargo.toml --bins",
  # ripgrep が見つからない場合は検査が走らないため、先に版の確認で失敗させる。
  "rg --version",
  # .gitignore に従って走査し、絵文字が無いことを検査する。 -g '!.git' で .git の中身を除き、
  # U+FE0F (絵文字表示セレクタ) で絵文字表示になる文字 (U+2764 と U+FE0F の組み合わせなど) も含める。
  # 見つけた行を出して失敗させるため ! で終了状態を反転する。
  # 限界: ripgrep の検索中のエラー (終了コード 2) も成功になり、U+FE0F を伴わない
  # テキスト表示の記号 (U+00A9 など) は検出しない。
  "! rg --hidden -g '!.git' --pcre2 '(\\p{Emoji_Presentation}|\\p{Emoji}\\x{FE0F})'",
]

[tasks.test]
description = "全ての自動テストを実行する"
depends = [
  "backend:test",
  "backend:test-integration",
  "frontend:test",
  "frontend:test-web",
  "frontend:test-integration",
  "frontend:test-same-origin",
]

[tasks.check]
description = "静的検査と全ての自動テストを実行する (CI と手元の共通の入口)"
depends = ["fmt", "lint", "frontend:build", "frontend:analyze", "formal", "test"]

[tasks.formal]
description = "認証の状態遷移の TLA+ 仕様を TLC でモデル検査する"
# tla2tools.jar は mise のレジストリに無いため、版とチェックサムを固定して取得する (ADR-0013)。
# jar はリポジトリに含めず、formal/.cache/ に置く (.gitignore の対象)。
# チェックサムの確認は標準のコマンド (curl、shasum) の組み合わせで行う (ADR-0009)。
run = """
set -e
if ! command -v shasum > /dev/null 2>&1; then
  echo "shasum is required to verify tla2tools.jar but was not found" >&2
  exit 1
fi
mkdir -p formal/.cache
if [ ! -f formal/.cache/tla2tools.jar ]; then
  curl -fsSL --connect-timeout 10 --max-time 300 -o formal/.cache/tla2tools.jar https://github.com/tlaplus/tlaplus/releases/download/v1.7.4/tla2tools.jar
fi
printf '%s  %s\\n' 936a262061c914694dfd669a543be24573c45d5aa0ff20a8b96b23d01e050e88 formal/.cache/tla2tools.jar | shasum -a 256 -c - > /dev/null || {
  echo "tla2tools.jar checksum mismatch: delete formal/.cache/tla2tools.jar and retry" >&2
  exit 1
}
java -cp formal/.cache/tla2tools.jar tlc2.TLC -workers 1 -cleanup -metadir formal/.cache/states -config formal/auth.cfg formal/auth.tla
"""

[tasks."backend:build"]
description = "利用者向けの Worker をビルドする"
dir = "backend/brew_book"
run = "worker-build --release"

[tasks."backend:test"]
description = "wrangler dev を起動するテスト以外のネイティブテストを実行する"
dir = "backend"
# テストは自動で検出される。 wrangler dev を起動するテストは名前に wrangler_ を付け、
# ここで名前で除外して backend:test-integration が実行する。
run = "cargo test --workspace -- --skip wrangler_"

[tasks."backend:test-integration"]
description = "wrangler dev を起動する結合テストを実行する"
dir = "backend"
# wrangler dev は Static Assets のディレクトリが無いと起動しないため、先に Flutter をビルドする (0017)。
depends = ["frontend:build"]
run = "cargo test -p brew_book --test dev_server --test d1_binding --test wrangler_auth_api --test wrangler_passkey_flow --test wrangler_records_api --test wrangler_purchases_brews_api --test wrangler_suggestions_api --test wrangler_photos_api --test wrangler_stats_api --test wrangler_export_api --test wrangler_account_api --test wrangler_records_scale --test wrangler_stats_scale --test wrangler_same_origin_api --test wrangler_display_name && cargo test -p brew_book_admin --test wrangler_admin_api"

[tasks.dev]
description = "ローカル開発の画面と API を同じオリジンから配信する"
depends = ["frontend:build"]
dir = "backend/brew_book"
# Flutter の開発サーバーは使わない (別オリジンになり、CORS を許可しない決定と Origin の検証に反する)。
# 画面は wrangler dev の Static Assets から返し、http://localhost:8787/ で開く (ADR-0005)。
# `[vars]` の RP_ID と ORIGIN は本番 (workers.dev) の値のため、ローカルの開発では ADR-0004 の
# 既定値 (`localhost` と `http://localhost:8787`) で上書きする。本番の値へ置き換えた後も同じタスクで開発できる。
run = "wrangler dev --var RP_ID:localhost --var ORIGIN:http://localhost:8787"

[tasks.deploy]
description = "Flutter をビルドしてから、画面と API を 1 つの Worker にデプロイする"
depends = ["frontend:build"]
dir = "backend/brew_book"
# スキーマ変更を含むリリースでは、先に `mise run db-migrate-remote` を実行する (README のデプロイ手順)。
# デプロイのタスクは `mise run check` に含めない (0002 の規則)。
run = "wrangler deploy"

[tasks."dev-admin"]
description = "管理者 Worker をローカルで起動する"
dir = "backend/brew_book_admin"
# 登録用リンクの利用者向けのオリジンは `[vars]` の `APP_ORIGIN` (本番の値) のため、
# ローカルでは利用者向けの `mise run dev` のオリジンで上書きする (ADR-0008)。
# wrangler のローカル D1 は設定ファイルのあるディレクトリの .wrangler/state に作るため、
# 利用者向けの Worker と同じデータベースを参照するように --persist-to を揃える (ADR-0002、0031)。
# ポートは、既定の 8787 を使う利用者向けの Worker と分けて固定する。
run = "wrangler dev --port 8788 --persist-to ../brew_book/.wrangler/state --var APP_ORIGIN:http://localhost:8787"

[tasks."deploy-admin"]
description = "管理者 Worker をデプロイする"
dir = "backend/brew_book_admin"
# 管理者 Worker は利用者向けの Worker と同じ D1 をバインディングで参照し、マイグレーションを持たない (ADR-0002)。
# スキーマの適用は利用者向けの Worker のデプロイ手順で行い、Cloudflare Access の設定はデプロイの後に行う (README)。
# デプロイのタスクは `mise run check` に含めない (0002 の規則)。
run = "wrangler deploy"

[tasks.load]
description = "ローカルの wrangler dev に VU 50 の負荷試験をかける (mise run dev の起動が必要)"
# 対象は認証が不要な経路だけとし、本番は対象にしない (ADR-0012)。check には含めない。
run = "k6 run load/k6/load.js"

[tasks."verify-deploy"]
description = "デプロイ後の確認: 管理者画面が Cloudflare Access で保護されていることを確認する"
# 認証なしで管理者画面 (GET /) と状態を変更する経路 (POST /users) を取得し、Access の
# ログイン画面への 302 になることを検証する。302 でなければ失敗させる (ADR-0008)。
# 対象の Worker の URL は環境変数 ADMIN_ORIGIN で渡す (例: https://brewbook-admin.<サブドメイン>.workers.dev)。
run = """
if [ -z "${ADMIN_ORIGIN:-}" ]; then
  echo "ADMIN_ORIGIN must be set to the admin worker origin" >&2
  exit 1
fi
verify() {
  method="$1"
  path="$2"
  # 接続できない場合も状態コードを "000" として扱い、原因の分かるメッセージで失敗させる。
  code=$(curl -s -o /dev/null -w '%{http_code}' -X "$method" "$ADMIN_ORIGIN$path" || true)
  location=$(curl -s -o /dev/null -w '%{redirect_url}' -X "$method" "$ADMIN_ORIGIN$path" || true)
  echo "$method $path -> $code $location"
  if [ "$code" != "302" ]; then
    echo "$method $path must redirect to the Access login page (302) but was $code" >&2
    exit 1
  fi
  if ! printf '%s' "$location" | grep -q 'cloudflareaccess.com'; then
    echo "$method $path must redirect to the Access login page but went to $location" >&2
    exit 1
  fi
}
verify GET /
verify POST /users
"""

[tasks."frontend:setup"]
description = "Frontend の依存を取得する"
dir = "frontend"
run = "flutter pub get"

[tasks."frontend:build"]
description = "Frontend を Web 向けにビルドする (CanvasKit)"
dir = "frontend"
# Flutter 3.47.5 の CLI にレンダラの指定は無く、JavaScript のビルドは CanvasKit を使う
# (skwasm は --wasm のときだけ使う)。よって指定は付けない (ADR-0007)。
run = "flutter build web"

[tasks."frontend:build-e2e"]
description = "実バックエンドの統合テスト (0017) が配信する、テストコード入りの Web ビルドを作る"
dir = "frontend"
# テストのブラウザは Worker の Static Assets から画面を読むため、テストの本体を
# ビルドに含める必要がある。check が作る配布用のビルド (build/web) とは混ぜない。
run = 'flutter build web -t integration_test/same_origin_test.dart -o "$PWD/build/e2e-web"'

[tasks."frontend:analyze"]
description = "Frontend の静的検査を実行する"
dir = "frontend"
run = "flutter analyze"

[tasks."frontend:test"]
description = "Widget テストを実行する (VM)"
dir = "frontend"
run = "flutter test"

[tasks."frontend:test-web"]
description = "ブラウザで動かすテストを実行する (Canvas を使うテストを含む)"
dir = "frontend"
run = "flutter test --platform chrome"

[tasks."frontend:test-integration"]
description = "統合テストを chromedriver で実行する"
dir = "frontend"
# flutter drive は chromedriver を起動しないため、同じ版の chromedriver を先に起動する (issue 0013)。
# 版は mise.toml の [tools] が持ち、統合テストの間だけ 4444 で待ち受ける。
run = """
chromedriver --port=4444 &
chromedriver_pid=$!
trap 'kill "$chromedriver_pid"' EXIT
flutter drive --driver=test_driver/integration_test.dart --target=integration_test/app_test.dart -d web-server --browser-name=chrome --headless
"""

[tasks."frontend:test-same-origin"]
description = "実バックエンドと仮想認証器で、ログインから抽出の保存までを検証する"
depends = ["frontend:build-e2e"]
dir = "backend"
# Rust のハーネスが wrangler dev と chromedriver を起動し、テストコード入りの Web ビルドを
# Static Assets として配信して、実際の画面を chrome で操作する (0017)。
run = "cargo test -p brew_book --test wrangler_same_origin_e2e"

[tasks."r2-setup"]
description = "R2 バケットの CORS とライフサイクルを適用する (本番環境に触るため check には含めない)"
dir = "backend/brew_book"
# デプロイ手順に含めて実行する。cors.json のオリジンは 0017 が確定させて置き換える。
run = [
  "wrangler r2 bucket cors set brewbook-photos --file cors.json",
  "wrangler r2 bucket lifecycle set brewbook-photos --file lifecycle.json",
]

[tasks."db-migrate"]
description = "ローカルの D1 にマイグレーションを適用する"
dir = "backend/brew_book"
run = "wrangler d1 migrations apply DB --local"

[tasks."db-migrate-remote"]
description = "本番の D1 にマイグレーションを適用する (デプロイ手順の中でだけ実行する)"
dir = "backend/brew_book"
run = "wrangler d1 migrations apply DB --remote"
